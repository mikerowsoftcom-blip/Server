<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Downloader</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b0b0d;
      color: #f5f5f5;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      width: min(680px, 100%);
      background: #171719;
      border: 1px solid #2b2b2f;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 18px 60px #0008;
    }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 7vw, 42px); }
    .sub { color: #aaa; margin-bottom: 24px; }
    input, select, button {
      width: 100%;
      min-height: 52px;
      border-radius: 12px;
      border: 1px solid #3a3a40;
      font-size: 16px;
    }
    input {
      padding: 0 15px;
      background: #0e0e10;
      color: white;
      margin-bottom: 12px;
    }
    button {
      cursor: pointer;
      border: 0;
      background: #e9e9e9;
      color: #111;
      font-weight: 700;
      margin-top: 12px;
    }
    button:disabled { opacity: .5; cursor: wait; }
    select {
      background: #0e0e10;
      color: white;
      padding: 0 12px;
      margin-top: 8px;
    }
    .preview {
      display: none;
      margin-top: 18px;
      padding: 12px;
      background: #101012;
      border-radius: 14px;
      gap: 14px;
    }
    .preview img {
      width: 150px;
      height: 85px;
      object-fit: cover;
      border-radius: 10px;
    }
    .title { font-weight: 700; }
    .muted { color: #999; font-size: 13px; margin-top: 5px; }
    #status { min-height: 24px; margin-top: 16px; color: #bbb; }
    .note { color: #777; font-size: 12px; margin-top: 20px; line-height: 1.5; }
    @media (max-width: 520px) {
      .card { padding: 20px; }
      .preview img { width: 110px; height: 62px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>YouTube Downloader</h1>
    <div class="sub">Download videos you own or are authorized to save.</div>

    <input id="url" type="url" placeholder="Paste YouTube URL here"
           autocomplete="off" autocapitalize="off">

    <button id="infoBtn">CHECK VIDEO</button>

    <section id="preview" class="preview">
      <img id="thumb" alt="">
      <div>
        <div id="title" class="title"></div>
        <div id="meta" class="muted"></div>
      </div>
    </section>

    <label for="quality" class="muted">Quality</label>
    <select id="quality">
      <option value="best">Best available</option>
      <option value="720p">Up to 720p</option>
      <option value="480p">Up to 480p</option>
      <option value="360p">Up to 360p</option>
    </select>

    <button id="downloadBtn" disabled>DOWNLOAD VIDEO</button>
    <div id="status">Ready</div>
    <div id="authHint" class="note" style="display:none"></div>

    <div class="note">
      Downloads are processed on the server. Render web services use
      ephemeral storage, so the server does not permanently store downloaded
      files.
    </div>
  </main>

<script>
const url = document.getElementById("url");
const infoBtn = document.getElementById("infoBtn");
const downloadBtn = document.getElementById("downloadBtn");
const quality = document.getElementById("quality");
const status = document.getElementById("status");
const preview = document.getElementById("preview");

let valid = false;

function setStatus(s) { status.textContent = s; }

infoBtn.onclick = async () => {
  const value = url.value.trim();
  if (!value) return setStatus("Paste a YouTube URL first.");

  valid = false;
  downloadBtn.disabled = true;
  infoBtn.disabled = true;
  preview.style.display = "none";
  setStatus("Checking video...");

  try {
    const r = await fetch("/api/info", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({url: value})
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Could not read video.");

    document.getElementById("thumb").src = data.thumbnail || "";
    document.getElementById("title").textContent = data.title;
    document.getElementById("meta").textContent =
      (data.channel || "YouTube") + (data.is_short ? " • Short" : " • Video");
    preview.style.display = "flex";
    valid = true;
    downloadBtn.disabled = false;
    setStatus("Ready to download.");
  } catch (e) {
    setStatus(e.message);
  } finally {
    infoBtn.disabled = false;
  }
};

downloadBtn.onclick = async () => {
  if (!valid) return;
  downloadBtn.disabled = true;
  infoBtn.disabled = true;
  setStatus("Downloading and preparing your file...");

  try {
    const r = await fetch("/api/download", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        url: url.value.trim(),
        quality: quality.value
      })
    });

    if (!r.ok) {
      const data = await r.json().catch(() => ({}));
      throw new Error(data.error || "Download failed.");
    }

    const blob = await r.blob();
    const disposition = r.headers.get("Content-Disposition") || "";
    let filename = "youtube-video";
    const match = disposition.match(/filename="?([^"]+)"?/i);
    if (match) filename = match[1];

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);

    setStatus("Download complete.");
  } catch (e) {
    setStatus(e.message);
  } finally {
    downloadBtn.disabled = false;
    infoBtn.disabled = false;
  }
};
</script>
</body>
</html>
