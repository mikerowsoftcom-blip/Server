<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fast AI</title><style>
:root{--bg:#0b0d10;--panel:#15181e;--border:#292e36;--text:#f2f4f7;--muted:#858d99;--blue:#4f83f7}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{display:flex;flex-direction:column}header{height:56px;min-height:56px;border-bottom:1px solid var(--border);background:var(--panel);display:flex;align-items:center;padding:0 16px;font-weight:650}.status{margin-left:auto;color:var(--muted);font-size:12px}.status.ok{color:#4ade80}.status.bad{color:#f87171}#chat{flex:1;overflow:auto;padding:24px 12px 125px}.wrap{max-width:780px;margin:0 auto}.welcome{text-align:center;color:var(--muted);padding-top:18vh}.welcome h1{color:var(--text);font-size:28px;margin:0 0 8px}.welcome p{margin:0}.msg{display:flex;margin:0 auto 18px;gap:9px;max-width:780px}.avatar{width:30px;height:30px;min-width:30px;border-radius:9px;background:#2a303a;display:grid;place-items:center;font-size:12px;font-weight:700}.user .avatar{background:var(--blue)}.body{min-width:0;max-width:calc(100% - 39px)}.name{font-size:11px;color:var(--muted);margin:2px 0 4px}.text{font-size:15px;line-height:1.58;white-space:pre-wrap;overflow-wrap:anywhere}.composer{position:fixed;left:0;right:0;bottom:0;padding:10px 12px max(10px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 24%)}form{max-width:780px;margin:auto;display:flex;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:7px}textarea{flex:1;min-height:42px;max-height:130px;resize:none;background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:15px;padding:9px}textarea::placeholder{color:#6e7682}button{width:46px;height:44px;border:0;border-radius:10px;background:var(--blue);color:white;font-size:20px;cursor:pointer}button:disabled{opacity:.45}.hint{text-align:center;color:#606875;font-size:10px;margin-top:5px}@media(max-width:600px){#chat{padding:18px 10px 120px}.welcome{padding-top:14vh}.welcome h1{font-size:25px}.text{font-size:14px}}
</style></head><body><header>Fast AI <span id="status" class="status">Connecting…</span></header><main id="chat"><div class="wrap" id="wrap"><div class="welcome" id="welcome"><h1>Fast AI</h1><p>Qwen 0.5B running on your Render service.</p></div></div></main><div class="composer"><form id="form"><textarea id="input" rows="1" placeholder="Message…"></textarea><button id="send" type="submit">↑</button></form><div class="hint">Enter to send · Shift+Enter for a new line</div></div><script>
const API='https://fantastic-happiness-gh01.onrender.com';const history=[];const chat=document.getElementById('wrap'),welcome=document.getElementById('welcome'),input=document.getElementById('input'),send=document.getElementById('send'),status=document.getElementById('status');let busy=false;
function setStatus(t,bad=false){status.textContent=t;status.className='status '+(bad?'bad':'ok')}async function health(){try{const r=await fetch(API+'/health',{cache:'no-store'});const d=await r.json();if(r.ok&&d.model_loaded)setStatus('● Ready');else setStatus('● Model loading',true)}catch(e){setStatus('● Offline',true)}}
function add(role,text=''){welcome.style.display='none';const m=document.createElement('div');m.className='msg '+role;const a=document.createElement('div');a.className='avatar';a.textContent=role==='user'?'U':'AI';const b=document.createElement('div');b.className='body';const n=document.createElement('div');n.className='name';n.textContent=role==='user'?'You':'AI';const t=document.createElement('div');t.className='text';t.textContent=text;b.append(n,t);m.append(a,b);chat.append(m);scroll();return t}function scroll(){requestAnimationFrame(()=>{document.getElementById('chat').scrollTop=document.getElementById('chat').scrollHeight})}function resize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,130)+'px'}input.addEventListener('input',resize);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
async function ask(text){if(busy)return;busy=true;send.disabled=true;input.disabled=true;add('user',text);history.push({role:'user',content:text});const out=add('assistant','');setStatus('● Generating…');const messages=[{role:'system',content:'You are a helpful, concise assistant. Answer directly and avoid unnecessary repetition.'},...history.slice(-8)];try{const r=await fetch(API+'/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages,max_tokens:160,temperature:.7,stream:true})});if(!r.ok)throw new Error((await r.text())||('HTTP '+r.status));const reader=r.body.getReader(),decoder=new TextDecoder();let buf='',answer='';while(true){const x=await reader.read();if(x.done)break;buf+=decoder.decode(x.value,{stream:true});const parts=buf.split('\n\n');buf=parts.pop();for(const part of parts){const line=part.split('\n').find(x=>x.startsWith('data: '));if(!line)continue;const raw=line.slice(6);if(raw==='[DONE]')continue;const d=JSON.parse(raw);if(d.error)throw new Error(d.error.message||'Generation failed');const piece=d.choices?.[0]?.delta?.content||'';if(piece){answer+=piece;out.textContent=answer;scroll()}}}if(!answer)throw new Error('The model returned no text');history.push({role:'assistant',content:answer});setStatus('● Ready')}catch(e){out.textContent='Error: '+e.message;setStatus('● Error',true);history.pop()}finally{busy=false;send.disabled=false;input.disabled=false;input.focus();scroll()}}
form.addEventListener('submit',e=>{e.preventDefault();const t=input.value.trim();if(!t||busy)return;input.value='';resize();ask(t)});health();input.focus();
</script></body></html>
