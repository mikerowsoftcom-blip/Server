<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qwen AI</title>
<style>
:root{--bg:#0b0d10;--panel:#111419;--panel2:#181b21;--border:#292e36;--text:#f2f4f7;--muted:#8b929d;--accent:#3b82f6}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{display:flex;flex-direction:column;overflow:hidden}
header{height:60px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border);background:var(--panel)}
.brand{font-weight:700;display:flex;gap:10px;align-items:center}.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);display:grid;place-items:center;font-size:12px}.status{margin-left:auto;font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:#777}.ready .dot{background:#22c55e}.busy .dot{background:#f59e0b}.error .dot{background:#ef4444}
#chat{flex:1;overflow:auto;padding:28px 14px 145px}.welcome{text-align:center;max-width:700px;margin:14vh auto 0}.welcome h1{font-size:32px;margin:0 0 8px}.welcome p{color:var(--muted)}
.msg{max-width:850px;margin:0 auto 24px;display:flex;gap:11px}.avatar{width:32px;height:32px;flex:0 0 32px;border-radius:9px;background:#292e36;display:grid;place-items:center;font-size:12px;font-weight:700}.user .avatar{background:var(--accent)}.role{font-size:12px;color:var(--muted);margin-bottom:4px}.content{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;font-size:15px}.errorText{color:#fca5a5}
.composer{position:fixed;left:0;right:0;bottom:0;padding:12px 10px max(12px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 28%)}form{max-width:850px;margin:auto;display:flex;gap:8px;background:var(--panel2);border:1px solid var(--border);border-radius:15px;padding:8px}textarea{flex:1;background:transparent;border:0;outline:0;color:var(--text);resize:none;font:inherit;line-height:1.45;min-height:42px;max-height:170px;padding:9px}button{width:44px;height:44px;border:0;border-radius:11px;background:var(--accent);color:#fff;font-size:18px;font-weight:700}button:disabled{opacity:.45}.hint{text-align:center;color:#626975;font-size:11px;margin-top:6px}
@media(max-width:600px){#chat{padding-left:10px;padding-right:10px}.welcome h1{font-size:27px}.content{font-size:14px}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">AI</div><span>Qwen AI</span></div><div id="status" class="status"><i class="dot"></i><span id="statusText">Connecting...</span></div></header>
<main id="chat"><div id="welcome" class="welcome"><h1>How can I help?</h1><p>Qwen 2.5 0.5B · CPU INT4</p></div></main>
<div class="composer"><form id="form"><textarea id="input" rows="1" placeholder="Message Qwen..." disabled></textarea><button id="send" disabled>↑</button></form><div class="hint">Responses stream as they are generated.</div></div>
<script>
const history=[],chat=document.querySelector("#chat"),welcome=document.querySelector("#welcome"),input=document.querySelector("#input"),send=document.querySelector("#send"),status=document.querySelector("#status"),statusText=document.querySelector("#statusText");
function setStatus(c,t){status.className="status "+c;statusText.textContent=t}
function add(role,text=""){welcome.style.display="none";const r=document.createElement("div");r.className="msg "+role;r.innerHTML=`<div class="avatar">${role==="user"?"U":"AI"}</div><div><div class="role">${role==="user"?"You":"Assistant"}</div><div class="content"></div></div>`;r.querySelector(".content").textContent=text;chat.append(r);chat.scrollTop=chat.scrollHeight;return r.querySelector(".content")}
async function health(){try{const r=await fetch("/health");const j=await r.json();if(j.model_loaded){setStatus("ready","Ready");input.disabled=false;send.disabled=false;input.focus()}else setStatus("busy","Loading model...")}catch(e){setStatus("error","Server unavailable")}}
async function ask(text){input.disabled=true;send.disabled=true;history.push({role:"user",content:text});add("user",text);const out=add("assistant","");setStatus("busy","Generating...");try{const r=await fetch("/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history,max_tokens:160,temperature:.7,stream:true})});if(!r.ok)throw new Error("HTTP "+r.status);const reader=r.body.getReader(),dec=new TextDecoder();let buf="",answer="";while(true){const {value,done}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});const parts=buf.split("\n\n");buf=parts.pop();for(const part of parts){for(const line of part.split("\n")){if(!line.startsWith("data: "))continue;const d=line.slice(6);if(d==="[DONE]")continue;try{const j=JSON.parse(d),delta=j.choices?.[0]?.delta?.content||"";answer+=delta;out.textContent=answer;chat.scrollTop=chat.scrollHeight}catch{}}}}history.push({role:"assistant",content:answer});setStatus("ready","Ready")}catch(e){out.className+=" errorText";out.textContent="Error: "+e.message;history.pop();setStatus("error","Request failed")}input.disabled=false;send.disabled=false;input.focus()}
document.querySelector("#form").addEventListener("submit",e=>{e.preventDefault();const t=input.value.trim();if(t){input.value="";ask(t)}});input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();document.querySelector("#form").requestSubmit()}});health();setInterval(health,5000);
</script>
</body>
</html>
