<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Chat</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#101116;color:#f4f5f7;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{display:flex;flex-direction:column}header{height:58px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #292d36;background:#15171d}.brand{font-weight:700}.status{margin-left:auto;font-size:12px;color:#8f96a3}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#777;margin-right:6px}.online .dot{background:#22c55e}.error .dot{background:#ef4444}#chat{flex:1;overflow:auto;padding:20px 12px 125px}.message{max-width:850px;margin:0 auto 18px;display:flex}.bubble{max-width:88%;padding:12px 15px;border-radius:18px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.user{justify-content:flex-end}.user .bubble{background:#4f83f1}.assistant .bubble{background:#232630}.error .bubble{color:#fca5a5}.composer{position:fixed;left:0;right:0;bottom:0;padding:10px 10px max(10px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#101116 25%)}form{max-width:850px;margin:auto;display:flex;gap:8px;align-items:end}textarea{flex:1;min-height:50px;max-height:150px;resize:none;border:1px solid #30343d;border-radius:14px;background:#17191f;color:#fff;padding:13px;font:inherit;outline:none}button{height:50px;padding:0 22px;border:0;border-radius:14px;background:#4f83f1;color:white;font:inherit;font-weight:650}button:disabled{opacity:.5}.welcome{text-align:center;color:#8f96a3;margin-top:20vh}.welcome h1{color:#fff;font-size:30px;margin-bottom:8px}@media(max-width:600px){.bubble{max-width:92%}}
</style>
</head>
<body>
<header><div class="brand">AI Chat</div><div id="status" class="status"><span class="dot"></span><span id="statusText">Checking…</span></div></header>
<main id="chat"><div id="welcome" class="welcome"><h1>How can I help?</h1><div>Ask the model anything.</div></div></main>
<div class="composer"><form id="form"><textarea id="input" rows="1" placeholder="Type a message…"></textarea><button id="send">Send</button></form></div>
<script>
const API='https://fantastic-happiness-gh01.onrender.com';
const chat=document.querySelector('#chat'),input=document.querySelector('#input'),form=document.querySelector('#form'),send=document.querySelector('#send'),status=document.querySelector('#status'),statusText=document.querySelector('#statusText'),welcome=document.querySelector('#welcome');
let history=[];
function setStatus(t){status.className='status '+(t==='Ready'||t==='Generating…'?'online':'error');statusText.textContent=t}
function add(role,text){welcome.style.display='none';const row=document.createElement('div');row.className='message '+role;const b=document.createElement('div');b.className='bubble';b.textContent=text;row.appendChild(b);chat.appendChild(row);chat.scrollTop=chat.scrollHeight;return b}
async function health(){try{const r=await fetch(API+'/health',{cache:'no-store'});const d=await r.json();setStatus(d.model_loaded?'Ready':'Model loading…')}catch(e){setStatus('Offline')}}
form.addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();if(!text||send.disabled)return;input.value='';input.style.height='auto';add('user',text);history.push({role:'user',content:text});if(history.length>8)history=history.slice(-8);send.disabled=true;setStatus('Generating…');const out=add('assistant','');out.textContent='…';try{const r=await fetch(API+'/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history,max_tokens:160,temperature:.7})});const raw=await r.text();if(!r.ok)throw new Error(r.status+' '+raw);const d=JSON.parse(raw);const reply=d?.choices?.[0]?.message?.content||'(no response)';out.textContent=reply;history.push({role:'assistant',content:reply});if(history.length>8)history=history.slice(-8);setStatus('Ready')}catch(err){out.textContent='Error: '+err.message;setStatus('Error');history.pop()}finally{send.disabled=false;input.focus();chat.scrollTop=chat.scrollHeight}});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});health();
</script>
</body>
</html>
